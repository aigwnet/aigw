<mapper>
    <!-- insert: skip None columns, same as rbatis 4.6 impl_insert! -->
    <insert id="insert">
        `insert into tb_backend `
        <trim prefix="(" suffix=")" end=",">
            <if test="table.id != null">`id,`</if>
            <if test="table.location_id != null">`location_id,`</if>
            <if test="table.host != null">`host,`</if>
            <if test="table.port != null">`port,`</if>
            <if test="table.gmt_create != null">`gmt_create,`</if>
            <if test="table.gmt_modified != null">`gmt_modified,`</if>
        </trim>
        ` values `
        <trim prefix="(" suffix=")" end=",">
            <if test="table.id != null">#{table.id},</if>
            <if test="table.location_id != null">#{table.location_id},</if>
            <if test="table.host != null">#{table.host},</if>
            <if test="table.port != null">#{table.port},</if>
            <if test="table.gmt_create != null">#{table.gmt_create},</if>
            <if test="table.gmt_modified != null">#{table.gmt_modified},</if>
        </trim>
    </insert>

    <select id="select_by_location_id">
        `select * from tb_backend where location_id = #{location_id}`
    </select>

    <delete id="delete_by_id">
        `delete from tb_backend where id = #{id}`
    </delete>
</mapper>
